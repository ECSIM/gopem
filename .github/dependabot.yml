version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  exclude-paths:
      - "requirements-dev.txt"
      - "setup.py"
  schedule:
    interval: weekly
    time: "01:30"
  open-pull-requests-limit: 5
  target-branch: develop
  assignees:
      - "sepandhaghighi"
  ignore:
  - dependency-name: matplotlib
    versions:
    - 3.3.4
    - 3.4.0
  - dependency-name: pyqt5
    versions:
    - 5.15.3
